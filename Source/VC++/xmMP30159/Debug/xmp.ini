[xmMP3]
#################################################
# Number of devide depend of your system 
# WAVE_MAPPER = -1 (Default)
#################################################
DEVICE=-1
8BIT=False
MONO=False
SOFTVOLUME=True
FADEIN=True
FADEOUT=True
NOCALLBACK=False

#################################################
# Mp3 Buffer size
# 1-10 
# Default 1
#################################################
BUFFER=1
SAMPLERATE=44100


#################################################
# THREAD_BASE_PRIORITY_IDLE = -15
# THREAD_BASE_PRIORITY_LOWRT = 15
# THREAD_BASE_PRIORITY_MIN = -2
# THREAD_BASE_PRIORITY_MAX = 2
# THREAD_PRIORITY_LOWEST = THREAD_BASE_PRIORITY_MIN
# THREAD_PRIORITY_HIGHEST = THREAD_BASE_PRIORITY_MAX
# THREAD_PRIORITY_BELOW_NORMAL = (THREAD_PRIORITY_LOWEST + 1)
# THREAD_PRIORITY_ABOVE_NORMAL = (THREAD_PRIORITY_HIGHEST - 1)
# THREAD_PRIORITY_IDLE = THREAD_BASE_PRIORITY_IDLE
# THREAD_PRIORITY_NORMAL = 0
# THREAD_PRIORITY_TIME_CRITICAL = THREAD_BASE_PRIORITY_LOWRT
# HIGH_PRIORITY_CLASS = &H80
# IDLE_PRIORITY_CLASS = &H40
# ABOVE_NORMAL_PRIORITY = &H8000 
# NORMAL_PRIORITY_CLASS = &H20
# REALTIME_PRIORITY_CLASS = &H100
################################################
PROCESS=&H8000 
THREAD=0


################################################
# Header Scan Level
# 0-1024
#
# 128 Default
#
################################################
HSLEVEL=128


################################################
#Write Mpx decode Wave on disk
################################################
OUTONDISK=False
OTODDIR=""


[VISUALIZATION]
FONTFILE=FONT\TAMARRO.TTF
FONTNAME=TAMARRO
SHOWTASK=True
ROUND=15
SCALE=True
DISPSTR=""


################################################
#0 = RND (Default)
#1 = Back Forward
#2 = A Char at once
#3 = A Char at once (reverse)
################################################
SHOCKMODE=0


################################################
#Analyzer xmFFT
################################################
GAP=4
BARWIDTH=3
POINTFALLS=5
TOLLERANCE=1
FALLSVEL=5
NOFALLSVEL=10
FFTSAMPLE=512


################################################
# 1-10 
# Default 1
################################################
AMPLISPEC=2


################################################
#Volume View
#SHOWVOSC = Show Volume On Slide Change
################################################
VVENABLE=True


XPOSITION=100
YPOSITION=100
HIDEIDLE=5000
SHOWVOSC=False


[INSTALL]
EXT=MP3;MP2;MP1;MPA;WAV;M3U;LS;


[PREFERENCE]
SLIDEACCEL=1


################################################
#Option Save Stream Position
################################################
SSTREAMPOS=1


################################################
#Scan Level Accuracy (+ is best but slow, Def 0)
################################################
HINFOS=0


################################################
#Header Max Size Scan (In Byte, -1 is max)
################################################
HMAXSIZE=-1


################################################
#Open DialogBOX Char$ Buffer size in KByte
################################################
OBUFFER=32


################################################
#LCD232 anable, not yet implemented
################################################
MH=FALSE


[POS.INFO]
LISTFILE=mp3.ls
TOP=765 
LEFT=12090 
NOMINIMIZED=True
ONTOP=False
SHOWLIST=True
COSC=False
ANALYZER=True
SPECTRUMMODE=5 
CPULESS=False
VOLUME=26 
LASTMP3=C:\Downloads\Incoming\kelly minogue - fever.mp3
POS=980290
LOOP=False
RND=False
LSTTOP=2775
LSTLEFT=12090
LASTDIR=C:\Downloads\Incoming\


